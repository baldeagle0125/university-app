apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: backend
          image: university-app-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3333
              name: http
          envFrom:
            - configMapRef:
                name: university-app-config
          volumeMounts:
            - name: app-secrets
              mountPath: /run/secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: app-secrets
          secret:
            secretName: university-app-secrets
            items:
              - key: db-password
                path: db-password
              - key: jwt-secret-key
                path: jwt-secret-key
              - key: qr-secret-key
                path: qr-secret-key